services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: monolith_local
      POSTGRES_USER: monolith_local
      POSTGRES_PASSWORD: monolith_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - monolith_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monolith_local -d monolith_local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  monolith_pgdata:
